<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#335445" />
    <title>Nhà Mình · Chưa kết nối được</title>
    <style>
      :root { color-scheme: light dark; --paper: #f5f0e6; --ink: #332e25; --forest: #335445; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.7 system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
      main { width: min(100%, 30rem); }
      h1 { font-size: clamp(2rem, 8vw, 3rem); line-height: 1.2; }
      .label { color: var(--forest); font-weight: 700; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: .65rem 1.2rem; background: var(--forest); color: #fff; border-radius: .8rem; text-decoration: none; }
      a:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { :root { --paper: #242c26; --ink: #f5f0e6; --forest: #7daa8f; } a { color: #15291d; } }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Nhà Mình</p>
      <h1>Ngôi nhà vẫn ở đây.</h1>
      <p>Chưa kết nối được với Nhà Mình. Bạn có thể thử mở lại khi thuận tiện.</p>
      <p>Bạn cần kết nối để vào không gian riêng của hai đứa.</p>
      <a href="/">Thử mở lại</a>
      <p><a href="/offline">Nháp trên thiết bị</a></p>
    </main>
  </body>
</html>
